<title>__TITLE__</title>
<style>
/* ==========================================================================
   Palette. Categorical slots validated with the dataviz validator in both
   modes: light (surface #fbfaf8) worst adjacent CVD dE 21.9, normal-vision
   23.4, all >= 3:1 contrast; dark (surface #14120f) CVD 23.2, normal 25.2,
   all >= 3:1. Slot 1 is GoFundMe green, stepped per mode to stay in the
   lightness band and clear contrast on its own surface.
   ========================================================================== */
:root{
  color-scheme: light;
  --page:#f6f4f1; --surface:#fbfaf8; --surface-2:#ffffff; --raised:#ffffff;
  --ink:#111110; --ink-2:#55524d; --ink-3:#8a867f;
  --line:#e6e2dc; --line-2:#f0ede8; --hair:rgba(17,17,16,.08);
  --brand:#028046; --brand-strong:#016b3c; --brand-tint:#e8f5ee; --brand-ink:#ffffff;
  --s1:#028046; --s2:#2a78d6; --s3:#eb6834; --s4:#4a3aa7;
  --good:#0ca30c; --good-ink:#046904; --warn:#fab219; --warn-ink:#8a5c00; --crit:#d03b3b;
  --track:#ece8e2; --shadow:0 1px 2px rgba(17,17,16,.04),0 8px 24px -12px rgba(17,17,16,.10);
  --shadow-lift:0 2px 4px rgba(17,17,16,.05),0 18px 40px -18px rgba(17,17,16,.18);
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0a0908; --surface:#14120f; --surface-2:#1c1a16; --raised:#1c1a16;
    --ink:#faf9f7; --ink-2:#c2beb6; --ink-3:#8a867f;
    --line:#2a2723; --line-2:#221f1c; --hair:rgba(250,249,247,.10);
    --brand:#02a95c; --brand-strong:#04bb66; --brand-tint:#0e2419; --brand-ink:#06130c;
    --s1:#02a95c; --s2:#3987e5; --s3:#d95926; --s4:#9085e9;
    --good:#0ca30c; --good-ink:#3ec73e; --warn:#fab219; --warn-ink:#fac95e; --crit:#e26a6a;
    --track:#252219; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45),0 18px 40px -18px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0a0908; --surface:#14120f; --surface-2:#1c1a16; --raised:#1c1a16;
  --ink:#faf9f7; --ink-2:#c2beb6; --ink-3:#8a867f;
  --line:#2a2723; --line-2:#221f1c; --hair:rgba(250,249,247,.10);
  --brand:#02a95c; --brand-strong:#04bb66; --brand-tint:#0e2419; --brand-ink:#06130c;
  --s1:#02a95c; --s2:#3987e5; --s3:#d95926; --s4:#9085e9;
  --good:#0ca30c; --good-ink:#3ec73e; --warn:#fab219; --warn-ink:#fac95e; --crit:#e26a6a;
  --track:#252219; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45),0 18px 40px -18px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
  font-size:15px;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px 110px}

h1{font-size:2.1rem;line-height:1.12;margin:0 0 8px;letter-spacing:-.028em;font-weight:700}
.lede{color:var(--ink-2);margin:14px 0 26px;font-size:1.02rem;max-width:64ch}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:2px;padding:4px;background:var(--track);border-radius:13px;
  margin:0 0 32px;position:sticky;top:12px;z-index:30;
  box-shadow:0 0 0 1px var(--hair);backdrop-filter:saturate(180%) blur(12px);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:none;background:none;font:inherit;font-size:.9rem;font-weight:600;
  color:var(--ink-2);padding:9px 16px;border-radius:9px;cursor:pointer;white-space:nowrap;
  transition:color .22s var(--ease),background .22s var(--ease),box-shadow .22s var(--ease);
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--ink);box-shadow:var(--shadow)}
.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.panel[hidden]{display:none}
.panel{animation:panelIn .42s var(--ease-out) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- structure ---------- */
h2{font-size:1.32rem;margin:56px 0 6px;letter-spacing:-.02em;font-weight:700}
h2:first-of-type{margin-top:8px}
h3{font-size:1rem;margin:26px 0 10px;font-weight:650;letter-spacing:-.01em}
.eyebrow{
  font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand);margin:0 0 6px;
}
p.sub{color:var(--ink-2);margin:0 0 20px;max-width:74ch}
p.sub.tight{margin-bottom:12px}
.card{
  background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:22px 24px;box-shadow:var(--shadow);
}
.card.flat{box-shadow:none;background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid3>*{min-width:0}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
.stat{
  background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);
  padding:17px 19px;box-shadow:var(--shadow);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.stat .k{font-size:.74rem;color:var(--ink-3);font-weight:600;letter-spacing:.02em;margin-bottom:7px}
.stat .v{font-size:1.72rem;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.stat .d{font-size:.79rem;color:var(--ink-2);margin-top:4px}
.stat.accent .v{color:var(--brand)}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:3px}
.bar{display:grid;grid-template-columns:var(--lw,206px) 1fr var(--vw,110px);gap:12px;
  align-items:center;min-height:32px}
.bar>*{min-width:0}
.bar .l{font-size:.83rem;color:var(--ink-2);text-align:right;line-height:1.3}
.bar .l small{display:block;color:var(--ink-3);font-size:.72rem}
.trk{position:relative;height:17px;background:var(--track);border-radius:999px;overflow:hidden}
.fil{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--s1);
  width:0;transition:width .85s var(--ease-out)}
.bar .v{font-size:.83rem;font-variant-numeric:tabular-nums;font-weight:600}
.bar .v small{display:block;color:var(--ink-3);font-weight:400;font-size:.72rem}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.79rem;color:var(--ink-2);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* ---------- callouts ---------- */
.note{
  border-left:3px solid var(--brand);background:var(--surface);border-radius:0 var(--r) var(--r) 0;
  padding:13px 18px;font-size:.92rem;color:var(--ink-2);margin:16px 0;
}
.note b{color:var(--ink);font-weight:650}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--crit)}
.note.good{border-left-color:var(--good)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line-2);
  font-variant-numeric:tabular-nums;vertical-align:top}
th{color:var(--ink-3);font-weight:650;font-size:.71rem;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .18s var(--ease)}
tbody tr:hover{background:var(--line-2)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;
  font-size:.74rem;font-weight:650;letter-spacing:.01em;border:1px solid var(--hair);
  background:var(--surface-2);white-space:nowrap}
.pill.good{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.pill.warn{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.bad{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.pill.info{color:var(--s2);border-color:color-mix(in srgb,var(--s2) 30%,transparent)}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:.71rem;color:var(--ink-3);font-weight:650;letter-spacing:.05em;
  text-transform:uppercase}
.fld select,.fld input{
  font:inherit;font-size:.88rem;padding:9px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);min-width:0;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.btn{
  appearance:none;font:inherit;font-size:.86rem;font-weight:650;padding:10px 17px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  transition:background .2s var(--ease),transform .16s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
}
.btn:hover{background:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.86rem;
  font-weight:600;color:var(--ink-2);user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track2{width:40px;height:23px;border-radius:999px;background:var(--track);
  position:relative;transition:background .26s var(--ease);flex-shrink:0;
  box-shadow:inset 0 0 0 1px var(--hair)}
.switch .knob{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:var(--surface-2);box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform .26s var(--ease)}
.switch input:checked+.track2{background:var(--brand)}
.switch input:checked+.track2 .knob{transform:translateX(17px)}
.switch input:focus-visible+.track2{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- reveal-on-scroll ---------- */
.reveal{opacity:0;transform:translateY(14px);
  transition:opacity .6s var(--ease-out),transform .6s var(--ease-out)}
.reveal.in{opacity:1;transform:none}

/* ---------- footer ---------- */
footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--ink-3);font-size:.78rem}
code{font-size:.86em;background:var(--track);padding:2px 6px;border-radius:5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

@media (max-width:820px){
  body{font-size:14.5px}
  .wrap{padding:0 18px 84px}
  h1{font-size:1.7rem}
  h2{font-size:1.18rem;margin-top:44px}
  .grid2,.grid3{grid-template-columns:1fr}
  .bar{grid-template-columns:var(--lwm,116px) 1fr var(--vwm,88px);gap:9px}
  .bar .l{font-size:.76rem}
  .fld{flex:1 1 140px}
  .fld select,.fld input{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .reveal{opacity:1;transform:none}
  .fil{transition:none}
}
</style>
