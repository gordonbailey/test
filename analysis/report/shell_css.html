<style>
/* ==========================================================================
   App shell. A left rail of projects, one content column, hash routing.
   The rail is the only global navigation; each project owns whatever it puts
   inside its own view (the benchmarking project keeps its five sub-tabs).
   ========================================================================== */

.app{display:grid;grid-template-columns:var(--rail,286px) minmax(0,1fr);min-height:100vh}
.app>*{min-width:0}

/* ---------- rail ---------- */
.rail{
  grid-column:1;position:sticky;top:0;align-self:start;height:100vh;
  display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--line);
  padding:22px 0 14px;
}
/* .railhead is also a .nlink, and .nlink carries flex:1 — declared later, so
   it wins on order at equal specificity. Picking up that grow factor stretched
   the brand block down the whole rail and centred the logo halfway down the
   page. Hence the two-class selector: it has to outrank .nlink, not just
   precede it. */
.railhead.nlink{display:flex;align-items:center;gap:11px;padding:0 20px 4px;flex:none}
.railhead .mark{
  width:30px;height:30px;border-radius:9px;background:var(--brand);
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 2px 8px -2px color-mix(in srgb,var(--brand) 55%,transparent);
}
.railhead .mark svg{width:18px;height:18px;display:block}
.railhead .wm{font-size:.93rem;font-weight:700;letter-spacing:-.015em;line-height:1.2;min-width:0}
.railhead .wm span{display:block;color:var(--ink-3);font-weight:500;font-size:.76rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railterm{padding:14px 20px 10px;flex-shrink:0}
.railterm .t{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}

.railnav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 8px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.railnav::-webkit-scrollbar{width:8px}
.railnav::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

/* A row is a link plus, for parents, a twisty that toggles the children. */
.nrow{display:flex;align-items:stretch;gap:2px;border-radius:var(--r-sm);
  transition:background .18s var(--ease)}
.nrow:hover{background:var(--line-2)}
.nrow.on{background:var(--brand-tint)}
.nlink{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:var(--r-sm);text-decoration:none;
  color:var(--ink-2);font-size:.875rem;font-weight:600;line-height:1.3;
  transition:color .18s var(--ease);
}
.nrow:hover .nlink{color:var(--ink)}
.nrow.on .nlink{color:var(--brand-strong)}
.nlink .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.nlink:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.ntwist{
  appearance:none;border:none;background:none;cursor:pointer;padding:0 8px 0 4px;
  color:var(--ink-3);display:grid;place-items:center;flex-shrink:0;border-radius:var(--r-sm);
}
.ntwist svg{width:13px;height:13px;transition:transform .26s var(--ease)}
.ntwist[aria-expanded="true"] svg{transform:rotate(90deg)}
.ntwist:hover{color:var(--ink)}
.ntwist:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}

/* Depth is expressed as padding so the text column steps in cleanly. */
.nkids{overflow:hidden}
.nkids[hidden]{display:none}
.nlvl1 .nlink{padding-left:31px;font-weight:550;font-size:.85rem}
.nlvl2 .nlink{padding-left:52px;font-weight:500;font-size:.83rem}
.nlvl1 .ntwist{padding-left:25px}
.nlvl2 .ntwist{padding-left:46px}

/* Status dot. Colour is a hint; the home cards carry the readable label. */
.ndot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--ink-3);opacity:.45}
.ndot.live{background:var(--good);opacity:1}
.ndot.drafting{background:var(--warn);opacity:1}

.railfoot{padding:12px 20px 0;margin:8px 12px 0;border-top:1px solid var(--line);
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.railfoot .cnt{font-size:.72rem;color:var(--ink-3)}
.themebtn{
  appearance:none;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  flex-shrink:0;transition:background .2s var(--ease),color .2s var(--ease);
}
.themebtn:hover{background:var(--line-2);color:var(--ink)}
.themebtn svg{width:15px;height:15px}
.themebtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- main column ---------- */
.main{grid-column:2;min-width:0}
.view[hidden]{display:none}
.view{animation:viewIn .44s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Breadcrumb + title block that every project page shares. */
.phead{padding:34px 0 0}
.crumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.78rem;
  color:var(--ink-3);margin-bottom:14px}
.crumb a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent}
.crumb a:hover{color:var(--ink-2);border-bottom-color:var(--line)}
.crumb .sep{opacity:.5}
.crumb .cur{color:var(--ink-2);font-weight:600}
.ptitle{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ptitle h1{margin:0}

/* ---------- status pill ---------- */
.sp{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;
  font-size:.73rem;font-weight:650;border:1px solid var(--hair);background:var(--surface-2);
  white-space:nowrap;color:var(--ink-2)}
.sp i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
.sp.live{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.sp.live i{background:var(--good)}
.sp.drafting{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.sp.drafting i{background:var(--warn)}

/* ---------- home ---------- */
.hometop{padding:44px 0 0}
.eyebrow-lg{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brand);margin:0 0 12px}
.homeh1{font-size:2.5rem;line-height:1.08;letter-spacing:-.032em;font-weight:700;margin:0 0 14px;
  max-width:22ch}
.homelede{color:var(--ink-2);font-size:1.06rem;margin:0;max-width:66ch}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.cardgrid>*{min-width:0}
.pcard{
  display:flex;flex-direction:column;gap:9px;text-align:left;text-decoration:none;
  background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:20px 21px;box-shadow:var(--shadow);color:var(--ink);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);
}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);
  border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.pcard:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.pcard>.sp{align-self:flex-start;margin-bottom:1px}
.pcard .nm{font-size:1.02rem;font-weight:680;letter-spacing:-.016em;line-height:1.25}
.pcard .bl{font-size:.87rem;color:var(--ink-2);line-height:1.5;flex:1}
.pcard .bl.need{color:var(--ink-3)}
.pcard .bl.need b{color:var(--ink-2);font-weight:600}
.pcard .kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.kidchip{font-size:.73rem;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--track);color:var(--ink-2);white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.pcard .go{font-size:.8rem;font-weight:650;color:var(--brand);display:flex;align-items:center;gap:5px}
.pcard .go svg{width:13px;height:13px;transition:transform .26s var(--ease)}
.pcard:hover .go svg{transform:translateX(3px)}

/* ---------- skeleton page ---------- */
.needbox{
  border:1px dashed color-mix(in srgb,var(--warn) 55%,var(--line));border-radius:var(--r-lg);
  background:color-mix(in srgb,var(--warn) 5%,var(--surface));padding:20px 23px;margin:8px 0 30px;
}
.needbox .k{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn-ink);margin-bottom:7px}
.needbox p{margin:0;color:var(--ink-2);font-size:.94rem;max-width:70ch}
.sk{border-bottom:1px solid var(--line-2);padding:20px 0}
.sk:last-child{border-bottom:none}
.sk h3{margin:0 0 5px;font-size:1.02rem}
.sk p{margin:0;color:var(--ink-3);font-size:.9rem;max-width:70ch}
.subnav{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px}

/* ---------- written project pages ---------- */
a.btn{text-decoration:none}
.deckcard{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.deckcard>*{min-width:0}
.deckcard .dt{font-size:1.04rem;font-weight:680;letter-spacing:-.016em;line-height:1.3}
.deckcard .dl{display:flex;flex-direction:column;gap:9px;align-items:flex-start}
/* The link is long and a sandboxed frame may block target=_blank, so the URL
   is shown as selectable text beside the button rather than only behind it. */
.urlbox{font-size:.71rem;color:var(--ink-3);background:var(--track);padding:5px 9px;
  border-radius:7px;max-width:100%;overflow-wrap:anywhere;line-height:1.45}

.tierlist{list-style:none;margin:13px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.tierlist li{font-size:.92rem;font-weight:600;padding-left:15px;position:relative}
.tierlist li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;
  border-radius:50%;background:var(--ink-3);opacity:.55}
.tiernote{font-size:.82rem;color:var(--ink-3);margin:14px 0 0;line-height:1.5}

.bhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.bnum{width:25px;height:25px;border-radius:50%;background:var(--brand-tint);color:var(--brand-strong);
  font-size:.8rem;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.bname{font-size:1.04rem;font-weight:680;letter-spacing:-.016em;line-height:1.25}
.bsub{font-size:.82rem;color:var(--ink-3);margin-top:2px}
.blist{margin:0;padding-left:19px;font-size:.9rem;line-height:1.55;color:var(--ink-2)}
.blist li{margin-bottom:7px}
.blist li:last-child{margin-bottom:0}
.blist b{color:var(--ink);font-weight:650}
.gdv{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-top:15px;padding-top:13px;
  border-top:1px solid var(--line-2);font-size:.79rem;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.gdv b{font-size:.94rem;color:var(--brand);font-weight:700}
.gdv.gdvwarn b{color:var(--warn-ink)}
.tsub{font-size:.75rem;color:var(--ink-3)}

/* Cross-project links inside callouts. The router picks these up via
   data-jump, so they behave as in-page navigation, not external links. */
.note a{color:var(--brand-strong);font-weight:650;text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--brand) 45%,transparent)}
.note a:hover{border-bottom-color:var(--brand)}
.note a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* evidence tiles — a number and who said it */
.evid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.evid>*{min-width:0}
.ev{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);
  padding:18px 19px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.evn{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--crit);
  font-variant-numeric:tabular-nums}
.evn span{font-size:.86rem;font-weight:600;color:var(--ink-3);letter-spacing:0;margin:0 3px}
.evn.evtxt{font-size:1.14rem;color:var(--warn-ink);letter-spacing:-.02em}
.ev p{margin:0;font-size:.87rem;color:var(--ink-2);line-height:1.5;flex:1}
.evwho{font-size:.73rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3)}

/* attribution callout */
.attrib .attribnum{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;
  padding-bottom:16px;margin-bottom:4px;border-bottom:1px solid var(--line-2)}
.attrib .an{font-size:2.6rem;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--crit);
  grid-row:span 2}
.attrib .al{font-size:.94rem;color:var(--ink-2);line-height:1.5;align-self:end}
.attrib .aq{font-size:.87rem;color:var(--ink-3);font-style:italic;align-self:start}
@media (max-width:620px){
  .attrib .attribnum{grid-template-columns:1fr}
  .attrib .an{grid-row:auto}
}

/* dated timeline */
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--line-2);position:relative}
.tli:last-child{border-bottom:none}
.tli>*{min-width:0}
.tld{font-size:.77rem;font-weight:700;color:var(--ink-3);letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap}
.tlt{font-size:.92rem;color:var(--ink-2);line-height:1.5}
.tlt b{color:var(--ink);font-weight:700}
.tli.tlhot{background:color-mix(in srgb,var(--warn) 7%,transparent);
  border-radius:var(--r-sm);padding-left:12px;padding-right:12px;margin:0 -12px}
.tli.tlhot .tld{color:var(--warn-ink)}
@media (max-width:560px){
  .tli{grid-template-columns:1fr;gap:3px}
}

/* autonomy ladder */
.ladder{display:flex;flex-direction:column;gap:2px}
.rung{display:grid;grid-template-columns:172px 1fr;gap:16px;align-items:center;
  padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--hair)}
.rung>*{min-width:0}
.rl{font-size:.85rem;font-weight:680;color:var(--ink)}
.rv{font-size:.87rem;color:var(--ink-2);line-height:1.5}
.rung.rungempty{background:repeating-linear-gradient(135deg,transparent,transparent 7px,
  color-mix(in srgb,var(--warn) 9%,transparent) 7px,color-mix(in srgb,var(--warn) 9%,transparent) 14px);
  border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.rung.rungempty .rv{color:var(--warn-ink);font-weight:600}
@media (max-width:620px){
  .rung{grid-template-columns:1fr;gap:4px}
}

/* Linked-artifact rows: kind chip, title link, one line of provenance. */
.lnks{display:flex;flex-direction:column;gap:2px}
.lnk{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--line-2)}
.lnk:last-child{border-bottom:none}
.lnk>*{min-width:0}
.lk{font-size:.67rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);background:var(--track);padding:4px 8px;border-radius:6px;
  text-align:center;white-space:nowrap}
.lnk a{color:var(--brand-strong);font-weight:650;font-size:.92rem;text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--brand) 40%,transparent);
  overflow-wrap:anywhere}
.lnk a:hover{border-bottom-color:var(--brand)}
.lnk a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.lm{display:block;font-size:.82rem;color:var(--ink-3);margin-top:3px;line-height:1.45}
@media (max-width:620px){
  .lnk{grid-template-columns:1fr;gap:6px}
  .lk{justify-self:start}
}

/* In-table links inherit the same treatment. */
td a{color:var(--brand-strong);text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--brand) 40%,transparent)}
td a:hover{border-bottom-color:var(--brand)}

/* Rows whose live status differs from the source deck. */
tr.chg td{background:color-mix(in srgb,var(--warn) 6%,transparent)}
tr.chg td:first-child{box-shadow:inset 3px 0 0 var(--warn)}

/* Group headers and highlighted cells inside a long metric table. */
td.grp{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand);background:var(--brand-tint);padding-top:11px;padding-bottom:11px}
td.hot{background:color-mix(in srgb,var(--brand) 7%,transparent)}

/* ---------- mobile drawer ---------- */
.railtoggle{
  display:none;position:fixed;top:12px;left:12px;z-index:60;
  appearance:none;width:42px;height:42px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  place-items:center;cursor:pointer;box-shadow:var(--shadow-lift);
}
.railtoggle svg{width:19px;height:19px}
.scrim{display:none;position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.42);
  animation:fade .24s var(--ease-out) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
body.railopen .scrim{display:block}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main{grid-column:1}
  .railtoggle{display:grid}
  .rail{
    position:fixed;top:0;left:0;z-index:50;width:min(300px,84vw);
    transform:translateX(-102%);transition:transform .34s var(--ease);
    box-shadow:var(--shadow-lift);
  }
  body.railopen .rail{transform:none}
  .phead,.hometop{padding-top:64px}
  .homeh1{font-size:1.95rem}
  .homelede{font-size:.98rem}
  .tabs{top:0}
}
@media (max-width:820px){
  .cardgrid{grid-template-columns:1fr}
  .homeh1{font-size:1.72rem}
}

/* Presentation mode hides every other customer's name — and the rail, which
   lists the internal project tree, has no place on a client's screen either. */
body.present .rail,body.present .railtoggle,body.present .phead .crumb{display:none}
body.present .app{grid-template-columns:minmax(0,1fr)}
body.present .main{grid-column:1}

@media (prefers-reduced-motion:reduce){
  .view,.rail{animation:none;transition:none}
}
</style>
