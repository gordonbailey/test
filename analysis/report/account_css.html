<style>
/* ==========================================================================
   Account tab. Built for a seller sharing their screen: one decision per
   step, nothing on screen until it is needed, and a presentation mode that
   removes every other customer's name from view.
   ========================================================================== */

/* ---- search ---- */
.searchwrap{position:relative;max-width:560px}
.searchbox{
  display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  transition:border-color .22s var(--ease),box-shadow .22s var(--ease);
}
.searchbox:focus-within{border-color:var(--brand);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent),var(--shadow)}
.searchbox svg{width:19px;height:19px;color:var(--ink-3);flex-shrink:0}
.searchbox input{
  flex:1;min-width:0;border:none;background:none;font:inherit;font-size:1.02rem;
  color:var(--ink);outline:none;
}
.searchbox input::placeholder{color:var(--ink-3)}
/* The native search affordance would sit beside our own clear button. */
.searchbox input::-webkit-search-cancel-button,
.searchbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.clearbtn{appearance:none;border:none;background:var(--track);color:var(--ink-2);
  width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;
  display:none;place-items:center;flex-shrink:0;padding:0}
.clearbtn.on{display:grid}
.clearbtn:hover{background:var(--line);color:var(--ink)}

.suggest{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:40;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-lift);max-height:340px;overflow-y:auto;padding:6px;
  animation:dropIn .24s var(--ease-out) both;
}
.suggest[hidden]{display:none}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sg{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;
  padding:10px 12px;border:none;background:none;font:inherit;text-align:left;
  border-radius:var(--r-sm);cursor:pointer;color:var(--ink);
}
.sg:hover,.sg.cursor{background:var(--brand-tint)}
.sg .nm{font-size:.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .mt{font-size:.75rem;color:var(--ink-3);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.sg .rt{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.sgnone{padding:18px 14px;text-align:center;color:var(--ink-3);font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  appearance:none;font:inherit;font-size:.8rem;font-weight:600;padding:7px 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-2);cursor:pointer;
  transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
}
.chip:hover{background:var(--brand-tint);color:var(--brand-strong);border-color:var(--brand)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---- hero ---- */
.hero{
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--hair);border-radius:var(--r-xl);padding:28px 30px;
  box-shadow:var(--shadow);animation:heroIn .5s var(--ease-out) both;
}
@keyframes heroIn{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
.herotop{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between}
.heroname{font-size:1.6rem;font-weight:700;letter-spacing:-.028em;line-height:1.15;margin:0}
.herometa{color:var(--ink-2);font-size:.9rem;margin:7px 0 0}
.heronums{display:flex;flex-wrap:wrap;gap:34px;margin-top:24px}
.hn .k{font-size:.73rem;color:var(--ink-3);font-weight:650;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:5px}
.hn .v{font-size:1.9rem;font-weight:700;letter-spacing:-.032em;line-height:1}
.hn .d{font-size:.8rem;color:var(--ink-2);margin-top:5px}

/* percentile dial */
.dial{position:relative;width:104px;height:104px;flex-shrink:0}
.dial svg{transform:rotate(-90deg);display:block}
.dial .ring{fill:none;stroke:var(--track);stroke-width:9}
.dial .val{fill:none;stroke-width:9;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s var(--ease-out)}
.dial .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dial .lbl b{font-size:1.42rem;font-weight:700;letter-spacing:-.03em;display:block;line-height:1}
.dial .lbl span{font-size:.66rem;color:var(--ink-3);font-weight:650;letter-spacing:.05em;
  text-transform:uppercase}

/* ---- metric rows ---- */
.mrow{display:grid;grid-template-columns:158px 1fr 104px;gap:14px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-2)}
.mrow:last-child{border-bottom:none}
.mrow>*{min-width:0}
.mrow .ml{font-size:.86rem;color:var(--ink-2);text-align:right}
.mscale{position:relative;height:26px}
.mscale .band{position:absolute;top:9px;left:0;right:0;height:8px;border-radius:999px;
  background:var(--track)}
.mscale .mid{position:absolute;top:5px;width:2px;height:16px;left:50%;
  background:var(--ink-3);opacity:.5;border-radius:1px}
.mscale .pin{position:absolute;top:2px;width:4px;height:22px;border-radius:2px;
  transform:translateX(-2px);left:0;transition:left 1s var(--ease-out)}
.mrow .mv{font-size:.87rem;font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
.mrow .mv small{display:block;color:var(--ink-3);font-weight:400;font-size:.72rem}

/* ---- actions ---- */
.acts{display:flex;flex-direction:column;gap:10px}
.act{
  display:grid;grid-template-columns:30px 1fr auto;gap:14px;align-items:start;
  padding:15px 17px;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:var(--r);transition:transform .26s var(--ease),box-shadow .26s var(--ease);
}
.act:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.act .num{width:26px;height:26px;border-radius:50%;background:var(--brand-tint);
  color:var(--brand-strong);font-size:.82rem;font-weight:700;display:grid;place-items:center}
.act .t{font-size:.94rem;font-weight:650;margin-bottom:3px}
.act .m{font-size:.83rem;color:var(--ink-2)}
.act .lift{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.act .lift b{font-size:1rem;font-weight:700;color:var(--brand)}
.act .lift small{display:block;font-size:.71rem;color:var(--ink-3)}

/* ---- disclosure ---- */
.disc{border:1px solid var(--hair);border-radius:var(--r);background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow)}
.disc>summary{
  padding:15px 20px;cursor:pointer;font-weight:650;font-size:.93rem;list-style:none;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary:hover{background:var(--line-2)}
.disc>summary .cnt{font-size:.79rem;color:var(--ink-3);font-weight:500}
.disc>summary .caret{width:16px;height:16px;color:var(--ink-3);transition:transform .28s var(--ease)}
.disc[open]>summary .caret{transform:rotate(90deg)}
.disc[open]>summary{border-bottom:1px solid var(--line-2)}
.discbody{padding:18px 20px;animation:panelIn .32s var(--ease-out) both}

/* ---- peer list ---- */
.peers{display:flex;flex-direction:column;gap:2px;max-height:360px;overflow-y:auto}
.pr{display:grid;grid-template-columns:1fr 92px 74px;gap:12px;align-items:center;width:100%;
  padding:9px 11px;border:none;background:none;font:inherit;text-align:left;cursor:pointer;
  border-radius:var(--r-sm);color:var(--ink)}
.pr>*{min-width:0}
.pr:hover{background:var(--line-2)}
.pr.self{background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--brand)}
.pr .n2{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .s2{font-size:.73rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .v2{font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right}
.pr .v2 small{display:block;color:var(--ink-3);font-size:.7rem}
/* ---- research targets ---- */
/* A local view switch. Deliberately not .tab: app.js collects every .tab on the
   page into one roving-tabindex group, and a nested pair would join it. */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--track);border-radius:11px;
  box-shadow:0 0 0 1px var(--hair);margin-top:6px}
.segbtn{appearance:none;border:none;background:none;font:inherit;font-size:.85rem;font-weight:600;
  color:var(--ink-2);padding:7px 15px;border-radius:9px;cursor:pointer;white-space:nowrap;
  transition:color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.segbtn:hover{color:var(--ink)}
.segbtn.on{background:var(--card);color:var(--brand-strong);box-shadow:0 1px 3px rgba(0,0,0,.09)}

/* The list. One row per peer group, three names either side — the whole
   sampling frame on one screen instead of 38 dropdown selections. */
/* Fixed layout, or the longest organization name in the book sets the column
   width and pushes the third column off the side of the page. */
#rs-table{table-layout:fixed;width:100%}
#rs-table td{vertical-align:top}
#rs-table .gname{font-weight:600}
#rs-table .gmeta{font-size:.76rem;color:var(--ink-3);margin-top:2px}
.rsl{display:flex;flex-direction:column;gap:5px}
.rsl button{appearance:none;border:none;background:none;font:inherit;text-align:left;cursor:pointer;
  padding:3px 6px;margin:-3px -6px;border-radius:var(--r-sm);color:var(--ink);display:flex;
  align-items:baseline;gap:8px;min-width:0;width:100%}
.rsl button:hover{background:var(--line-2)}
.rsl .nm{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rsl .mk{font-size:.73rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rsl .none{font-size:.82rem;color:var(--ink-3);padding:3px 0}

/* Research shortlist rows carry a tag column. 176px is set by the longest
   label the tags produce ("$614K below median"), measured rather than guessed —
   a nowrap pill overruns its track silently, with no scrollbar and no clipping
   to give it away. */
.pr.rs{grid-template-columns:1fr 176px 96px 92px}
.pr.rs .v2:first-of-type{text-align:left}


/* ---- section numbering ----
   The findings tab hand-numbers its sections and reads far better for it. Every
   project page carries the same five-heading spine, so a counter gives them the
   same navigable structure without numbering fifteen files by hand. */
.pbody{counter-reset:sec}
.pbody>h2{
  counter-increment:sec;display:flex;align-items:baseline;gap:14px;
  margin-top:64px;padding-top:22px;border-top:1px solid var(--line-2);
}
.pbody>h2:first-of-type{margin-top:10px;padding-top:0;border-top:none}
.pbody>h2::before{
  content:counter(sec,decimal-leading-zero);
  color:var(--ink-3);font-weight:600;font-size:.82em;font-variant-numeric:tabular-nums;
  flex:none;
}
/* An h3 inside a numbered section is a step within it, not a peer of it. The
   two were within a hair of each other in weight, which is what made the pages
   read as a flat list of headings. */
.pbody h3{
  font-size:.94rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;
  font-weight:700;margin:34px 0 8px;
}
.pbody .sk h3,.pbody .card h3,.pbody .acc h3,.pbody details h3{
  font-size:1rem;color:var(--ink);text-transform:none;letter-spacing:-.01em;
  font-weight:650;margin:26px 0 10px;
}
.pbody .card h3:first-child,.pbody .sk h3{margin-top:0}

/* ---- accordion list ----
   One row per item, collapsed. Used for the caveats and next steps, which are
   the two blocks every page ends on: worth having, rarely read top to bottom. */
.acc{display:flex;flex-direction:column;gap:8px}
.acc details{border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow)}
.acc summary{padding:13px 16px;cursor:pointer;font-weight:650;font-size:.9rem;list-style:none;
  display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.45}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--line-2)}
.acc summary .caret{width:15px;height:15px;color:var(--ink-3);flex:none;
  transition:transform .28s var(--ease)}
.acc details[open] summary .caret{transform:rotate(90deg)}
.acc details[open] summary{border-bottom:1px solid var(--line-2)}
.acc .accbody{padding:14px 16px;font-size:.9rem;line-height:1.65;color:var(--ink-2);
  animation:panelIn .3s var(--ease-out) both}
.acc .accbody p{margin:0}
.acc .accnum{color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums;
  margin-right:2px;flex:none}

/* ---- talk track ---- */
.tt{display:flex;flex-direction:column;gap:16px}
.ttb .k{font-size:.69rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:6px}
.ttb .t{font-size:.94rem;line-height:1.6}
.ttb ol{margin:0;padding-left:22px;font-size:.92rem;line-height:1.6}
.ttb ol li{margin-bottom:7px}
.ttconf{font-size:.83rem;color:var(--ink-2);background:var(--page);border-radius:var(--r-sm);
  padding:11px 14px;border-left:3px solid var(--line)}

/* ---- presentation mode ---- */
body.present .hide-in-present{display:none!important}
body.present{font-size:16.5px}
body.present .heroname{font-size:1.9rem}
body.present .hn .v{font-size:2.2rem}
body.present .tabs{display:none}
/* The page title and lede frame the conversation well enough to keep, but the
   internal status pill and the project breadcrumb have no place on a client's
   screen. The rail is hidden by the shell's own present-mode rules. */
body.present .phead .sp{display:none}
.presentbar{
  display:none;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 18px;background:var(--brand-tint);border:1px solid var(--brand);
  border-radius:var(--r);margin-bottom:22px;font-size:.87rem;color:var(--brand-strong);
  font-weight:600;
}
body.present .presentbar{display:flex}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

@media (max-width:820px){
  .hero{padding:22px 20px}
  .heroname{font-size:1.35rem}
  .heronums{gap:22px}
  .hn .v{font-size:1.5rem}
  .mrow{grid-template-columns:106px 1fr 84px;gap:9px}
  .mrow .ml{font-size:.78rem}
  .act{grid-template-columns:26px 1fr;row-gap:6px}
  .act .lift{grid-column:2;text-align:left}
  .pr{grid-template-columns:1fr 78px}
  .pr .v2:last-child{display:none}
  /* The tag and the money both go; the percentile is the one number that
     still means something without room for the other two. */
  .pr.rs{grid-template-columns:1fr 78px}
  .pr.rs .v2:first-of-type,.pr.rs .v2:nth-of-type(2){display:none}
  .pr.rs .v2:last-child{display:block}
}
</style>
<style>
/* seller book controls */
.acctcontrols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.acctcontrols .searchwrap{flex:1 1 380px}

/* ==========================================================================
   Client one-pager modal. The download itself cannot be relied on: a published
   artifact runs in a sandboxed iframe, and without allow-downloads a
   programmatic download is blocked silently -- no error, nothing happens. So the
   image is always shown, with a real user-clicked save link, a clipboard copy,
   and right-click-save as the floor. At least one of those works everywhere.
   ========================================================================== */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
  background:rgba(17,17,16,.55);backdrop-filter:blur(3px);
  animation:fadeIn .2s var(--ease-out) both}
.modal[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modalcard{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lift);max-width:1000px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:popIn .28s var(--ease-out) both}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modalhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px 20px;border-bottom:1px solid var(--line-2)}
.modalbody{padding:16px 20px;overflow:auto;background:var(--page)}
.modalbody img{display:block;width:100%;height:auto;border:1px solid var(--hair);
  border-radius:var(--r-sm);background:#fff}
.modalfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;
  border-top:1px solid var(--line-2)}
@media (max-width:820px){
  .modal{padding:10px}
  .modalfoot{gap:8px}
  .acctcontrols .fld{flex:1 1 100%}
}
</style>
